services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: clinic
      POSTGRES_DB: clinic_booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the compose environment}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - clinic_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinic -d clinic_booking']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  clinic_postgres:
